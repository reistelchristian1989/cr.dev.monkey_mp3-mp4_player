<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>cr.dev.monkey's MP3 & MP4 Player</title>
        <!-- Verknüpfung zu separater CSS-Design-Datei-->
         <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>cr.dev.monkey's MP3 & MP4 Player</h1>
        <p>Designed & developed with ParrotOS & VS Codium by cr.dev.monkey...</p>

        <!-- Video Sektion -->
<div class="player-box">
    <h3>🎬 Video Player (MP4)</h3>
    <!-- Ein Datei-Auswahlfeld für Videos -->
    <input type="file" id="videoFilePicker" accept="video/mp4" multiple>
    <video id="myVideo" controls></video>
    <button id="toggleVideoAutoplayBtn" onclick="toggleVideoAutoplay()">🔄 Video Autoplay: AN</button>
    <button onclick="castVideo()">📺 Auf TV spiegeln (Cast/AirPlay)</button>
</div>

<!-- MP3 Sektion mit Equalizer -->
    <div class="player-box">
        <h3>🎵 MP3 Player & Equalizer</h3>
        <input type="file" id="audioFilePicker" accept="audio/mp3" multiple>
        
        <!-- GENAU EIN EINZIGER AUDIO-PLAYER -->
        <audio id="myAudio" controls preload="auto"></audio>
        <button id="toggleAudioAutoplayBtn" onclick="toggleAudioAutoplay()">🔄 Audio Autoplay: AN</button>
        
        <ul id="audioPlaylistUI"></ul>

        <div>
            <label>Bass (Low): <input type="range" id="bassRange" min="-20" max="20" value="0"></label><br>
            <label>Mitten (Mid): <input type="range" id="midRange" min="-20" max="20" value="0"></label><br>
            <label>Höhen (High): <input type="range" id="highRange" min="-20" max="20" value="0"></label>
        </div>
    </div>

          <!-- Playlist Speicher Sektion -->
            <div class="player-box">
            <h3>💾 Playlist Manager (Local Storage)</h3>
            <input type="text" id="trackinput" placeholder="Hier Name der Playlist eintragen...">
            <button onclick="savePlaylist()">Zur Playlist hinzufügen</button>
            <ul id="playlistContainer"></ul>
            </div>

                <div class="player-box" style="text-align: center;">
    <button onclick="openImpressumModal()">📜 Zum Impressum & Danksagung</button>
</div>

    <!-- Overlay Modal für Impressum (damit Audio/Video nicht stoppt) -->
    <div id="impressumModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; overflow-y:auto; padding:20px; box-sizing:border-box;">
        <div class="player-box" style="max-width:800px; margin: 40px auto; position:relative;">
            <button onclick="closeImpressumModal()" style="position:absolute; top:10px; right:10px;">❌ Schließen</button>
            <iframe src="impressum.html" style="width:100%; height:500px; border:none; background:transparent;"></iframe>
        </div>
    </div>

           <script src="app.js"></script>
    </body>
</html>
