<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cr.dev.monkey's MP3 & MP4 Player</title>
    <!-- Verknüpfung zu separater CSS-Design-Datei -->
    <link rel="stylesheet" href="style.css">
    <!-- HLS.js Bibliothek für m3u8 Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h1>cr.dev.monkey's MP3 & MP4 Player</h1>
    <p>Designed & developed with ParrotOS & VS Codium by cr.dev.monkey...</p>

    <!-- Video Sektion -->
    <div class="player-box">
        <h3>🎬 Video Player (MP4)</h3>
        <!-- Ein Datei-Auswahlfeld für Videos -->
        <input type="file" id="videoFilePicker" accept="video/mp4" multiple>
        <video id="myVideo" controls></video>
        <button id="toggleVideoAutoplayBtn" onclick="toggleVideoAutoplay()">🔄 Video Autoplay: AN</button>
        <button onclick="castVideo()">📺 Auf TV spiegeln (Cast/AirPlay)</button>
    </div>

    <!-- HLS Stream & Playlist Sektion (Neu hinzugefügt) -->
    <div class="player-box">
        <h3>📡 HLS Stream & Playlist (.m3u8)</h3>
        <input type="text" id="hlsUrlInput" placeholder="https://.../stream.m3u8" style="width: 70%; padding: 8px; margin-bottom: 10px; font-family: monospace;">
        <button id="playHlsUrlBtn">Stream abspielen</button>
        <br>
        <label for="hlsFilePicker" style="cursor: pointer; background: #00ffcc; color: #171212; padding: 8px 12px; border-radius: 24px; font-weight: bold; display: inline-block; margin-top: 5px;">M3U8-Datei laden</label>
        <input type="file" id="hlsFilePicker" accept=".m3u8,.txt" style="display:none;">
        <span id="hlsFileName" style="margin-left: 10px; font-family: monospace; color: #fff;"></span>
        <br><br>
        <video id="hlsVideo" controls style="width: 100%; margin-top: 10px;"></video>
    </div>

    <!-- MP3 Sektion mit Equalizer -->
    <div class="player-box">
        <h3>🎵 MP3 Player & Equalizer</h3>
        <input type="file" id="audioFilePicker" accept="audio/mp3" multiple>
        
        <!-- GENAU EIN EINZIGER AUDIO-PLAYER -->
        <audio id="myAudio" controls preload="auto"></audio>
        <button id="toggleAudioAutoplayBtn" onclick="toggleAudioAutoplay()">🔄 Audio Autoplay: AN</button>

        <ul id="audioPlayListUI"></ul>

        <div class="equalizer-box">
            <label>Bass (Low): <input type="range" id="bassRange" min="-20" max="20" value="0" step="1"></label>
            <label>Mitten (Mid): <input type="range" id="midRange" min="-20" max="20" value="0" step="1"></label>
            <label>Höhen (High): <input type="range" id="highRange" min="-20" max="20" value="0" step="1"></label>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
